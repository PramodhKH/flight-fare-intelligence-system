project:
  name: Flight Fare Intelligence System
  task: regression
  currency: INR
  random_seed: 42

data:
  raw_path: data/raw/Flight_Booking.csv
  target: price
  expected_rows: 300153
  expected_routes: 30
features:
  deployed:
    - airline
    - source_city
    - destination_city
    - departure_time
    - stops
    - class
    - duration
    - days_left
  analysis_only:
    - flight
    - arrival_time
  ignored:
    - "Unnamed: 0"
splitting:
  strategy: scenario_grouped_stratified
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  group_by:
    - airline
    - source_city
    - destination_city
    - departure_time
    - stops
    - class
    - duration
    - days_left
  stratify_by:
    - directed_route
    - class
    - booking_horizon
  booking_horizon_buckets:
    - "1-7"
    - "8-14"
    - "15-21"
    - "22-35"
    - "36-49"
models:
  planned:
    - linear_regression
    - random_forest
    - xgboost
    - catboost
metrics:
  primary: rmse
  secondary:
    - mae
    - r2
    - mape

baseline:
  model: linear_regression
  fit_split: train
  benchmark_split: validation
  sealed_split: test
  preprocessing:
    categorical: one_hot_encode_drop_first_handle_unknown_ignore
    numeric: standard_scale
  artifact_path: models/phase3_linear_regression.joblib
