project:
  name: Flight Fare Intelligence System
  task: regression
  currency: INR
  random_seed: 42

data:
  raw_path: data/raw/Flight_Booking.csv
  target: price
  expected_rows: 300153
  expected_routes: 30
features:
  deployed:
    - airline
    - source_city
    - destination_city
    - departure_time
    - stops
    - class
    - duration
    - days_left
  analysis_only:
    - flight
    - arrival_time
  ignored:
    - "Unnamed: 0"
splitting:
  strategy: scenario_grouped_stratified
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  group_by:
    - airline
    - source_city
    - destination_city
    - departure_time
    - stops
    - class
    - duration
    - days_left
  stratify_by:
    - directed_route
    - class
    - booking_horizon
  booking_horizon_buckets:
    - "1-7"
    - "8-14"
    - "15-21"
    - "22-35"
    - "36-49"
models:
  planned:
    - linear_regression
    - random_forest
    - xgboost
    - catboost
metrics:
  primary: rmse
  secondary:
    - mae
    - r2
    - mape

baseline:
  model: linear_regression
  fit_split: train
  benchmark_split: validation
  sealed_split: test
  preprocessing:
    categorical: one_hot_encode_drop_first_handle_unknown_ignore
    numeric: standard_scale
  artifact_path: models/phase3_linear_regression.joblib

phase4:
  fit_split: train
  tuning_and_benchmark_split: validation
  sealed_split: test
  candidate_search:
    random_forest:
      - balanced
      - high_capacity
    xgboost:
      - balanced
      - high_capacity
    catboost:
      - compact_native_cat
      - expanded_native_cat
  system_benchmarks:
    inference_sample_rows: 5000
    inference_repeats: 5
    compare_model_size: true
  selection_policy:
    primary: rmse
    tie_breakers:
      - mae
      - median_batch_latency
      - model_size

phase5:
  champion: xgboost
  evaluation_split: validation
  sealed_split: test
  retuning_allowed: false
  segment_dimensions:
    - class
    - airline
    - route
    - booking_horizon
    - stops
    - departure_time
    - fare_band
    - training_market_context_support
  fare_bands_inr:
    - "<10000"
    - "10000-19999"
    - "20000-39999"
    - "40000-59999"
    - "60000-79999"
    - ">=80000"
  sparse_market_context_threshold_rows: 25
  market_context:
    - airline
    - source_city
    - destination_city
    - class
    - departure_time
    - stops
  stress_tests:
    - high_fare_80k_plus
    - very_high_fare_100k_plus
    - last_minute_1_7_days
    - sparse_market_context
    - unseen_market_context
    - long_duration_p90_plus

phase6:
  champion: xgboost
  evaluation_split: validation
  sealed_split: test
  retuning_allowed: false
  global_explainability:
    method: approximate_treeshap
    coverage: full_validation_split
  local_explainability:
    method: exact_treeshap
    representative_cases:
      - representative_economy
      - representative_business
      - representative_last_minute
      - representative_high_fare
  raw_feature_aggregation: sum_transformed_shap_back_to_deployed_feature
  segment_explanations:
    - overall_validation
    - economy
    - business
    - last_minute_1_7_days
    - high_fare_80k_plus


phase7:
  champion: xgboost
  sealed_split: test
  validation_partition:
    strategy: scenario_preserving_deterministic_hash
    calibration_fraction: 0.50
    evaluation_fraction: 0.50
  uncertainty:
    method: tail_aware_hierarchical_asymmetric_split_conformal_residual_intervals
    nominal_coverage: 0.90
    minimum_rows_per_rule: 150
    high_fare_business_guardrail:
      predicted_fare_bands:
        - 60-80k
        - 80k+
      upper_residual_quantile: 0.995
      minimum_rows: 50
  fare_opportunity:
    comparison_group:
      - directed_route
      - class
      - booking_horizon
    score: 100_minus_empirical_fare_percentile
  reliability:
    score: inverse_percentile_of_relative_prediction_interval_width
    interpretation: comparative_uncertainty_not_probability
  decision_support:
    wait_window_days: 7
    material_change_percent: 5.0
    labels:
      - BUY_NOW
      - MONITOR
      - WAIT_OR_MONITOR
    live_price_forecast_claim: false
