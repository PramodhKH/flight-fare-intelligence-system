[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-fare-intelligence"
version = "1.0.0"
description = "Explainable flight fare decision-intelligence system with uncertainty, FastAPI, and Streamlit."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<4",
  "catboost>=1.2,<2",
  "shap>=0.46,<1",
  "joblib>=1.4,<2",
  "PyYAML>=6,<7",
  "pydantic>=2.8,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "streamlit>=1.38,<2",
  "plotly>=5.24,<7",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
